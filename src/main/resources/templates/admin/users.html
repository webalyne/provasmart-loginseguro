<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Usuários')}"></head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>
    <main>
        <h1>Usuários</h1>
        <p role="status" th:if="${success}" th:text="${success}"></p>
        <p class="erro" role="alert" th:if="${error}" th:text="${error}"></p>
        <div class="tabela">
            <table>
                <caption>Contas cadastradas</caption>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Perfil</th>
                        <th>Situação</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${users}">
                        <td th:text="${u.name}"></td>
                        <td th:text="${u.email}"></td>
                        <td th:text="${u.role}"></td>
                        <td th:text="${u.enabled ? 'Ativa' : 'Desativada'}"></td>
                        <td>
                            <a th:if="${u.email != #authentication.name}"
                               th:href="@{/admin/usuarios/{id}/editar(id=${u.id})}">
                                Editar
                            </a>
                            <span th:if="${u.email == #authentication.name}">
                                Sua conta
                            </span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="5">Nenhum usuário cadastrado.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
