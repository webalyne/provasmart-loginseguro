<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>
    <main>
        <section class="formulario">
            <h1>Login</h1>
            <p class="erro" role="alert" th:if="${param.error}">
                E-mail ou senha inválidos, ou conta desativada.
            </p>
            <p role="status" th:if="${param.registered}">
                Cadastro realizado. Entre com seu e-mail e senha.
            </p>
            <p role="status" th:if="${param.logout}">Você saiu da conta.</p>
            <p class="erro" role="alert" th:if="${param.expired}">
                Sessão encerrada. Faça login novamente.
            </p>
            <form th:action="@{/login}" method="post">
                <label for="email">E-mail</label>
                <input id="email" name="email" type="email"
                       autocomplete="username" maxlength="254" required>
                <label for="password">Senha</label>
                <input id="password" name="password" type="password"
                       autocomplete="current-password" maxlength="64" required>
                <button type="submit">Entrar</button>
            </form>
            <p><a th:href="@{/cadastro}">Criar uma conta</a></p>
        </section>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
