<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Início')}"></head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>
    <main>
        <h1>ProvaSmart Auth</h1>
        <p>Sistema de login e controle de usuários.</p>
        <p>O acesso às páginas depende do perfil da conta:</p>
        <ul>
            <li>Administrador: gerencia os usuários.</li>
            <li>Professor: acessa a área do professor.</li>
            <li>Estudante: acessa a área do estudante.</li>
        </ul>
        <div sec:authorize="isAnonymous()">
            <a th:href="@{/login}">Entrar</a> |
            <a th:href="@{/cadastro}">Criar conta</a>
        </div>
        <a sec:authorize="isAuthenticated()" th:href="@{/painel}">
            Acessar meu painel
        </a>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
